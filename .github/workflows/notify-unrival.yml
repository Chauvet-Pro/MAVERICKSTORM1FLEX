name: Notify UNRIVAL

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -D /tmp/h -o /tmp/b -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/Chauvet-Pro/UNRIVAL
          echo "--- sso/scope headers ---"
          grep -iE "x-github-sso|x-oauth-scopes|x-accepted" /tmp/h || echo "(none)"
          echo "--- body ---"
          tr -d '\n' < /tmp/b | head -c 300
        env:
          TOKEN: ${{ secrets.UNRIVAL_DISPATCH_TOKEN }}
